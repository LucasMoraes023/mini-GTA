name: Android Build
permissions:
  contents: write
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FishingPilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk

# build trigger: diagnostic overlay
      - name: Publish direct APK release asset
        if: github.ref == 'refs/heads/fix/strict-detection-from-report'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fishingpilot-build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Fishing Pilot APK ${GITHUB_RUN_NUMBER}" \
            --notes "APK compilado automaticamente a partir do commit ${GITHUB_SHA}. A compilação não substitui o teste no Horizonte RP."
